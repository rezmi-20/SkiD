<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="100%" height="100%">
  <defs>
    <linearGradient id="docBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140E26" />
      <stop offset="50%" stop-color="#1F1538" />
      <stop offset="100%" stop-color="#0E091C" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D224E" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1B1433" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="docShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="700" height="520" fill="url(#docBg)" />

  <!-- Technical Background Grid -->
  <g stroke="#C084FC" stroke-opacity="0.06" stroke-width="1.2">
    <line x1="0" y1="100" x2="700" y2="100" />
    <line x1="0" y1="200" x2="700" y2="200" />
    <line x1="0" y1="300" x2="700" y2="300" />
    <line x1="0" y1="400" x2="700" y2="400" />
    <line x1="175" y1="0" x2="175" y2="520" />
    <line x1="350" y1="0" x2="350" y2="520" />
    <line x1="525" y1="0" x2="525" y2="520" />
  </g>

  <!-- Contract Document Card -->
  <g filter="url(#docShadow)" transform="translate(60, 40)">
    <rect width="580" height="440" rx="24" fill="url(#paperGrad)" stroke="#C084FC" stroke-opacity="0.35" stroke-width="1.6" />

    <!-- Document Header -->
    <g transform="translate(36, 32)">
      <rect width="36" height="36" rx="8" fill="url(#accentPurple)" />
      <path d="M12 10 H24 M12 16 H24 M12 22 H19" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" />

      <text x="48" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="18">DIGITAL SERVICE CONTRACT</text>
      <text x="48" y="38" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" letter-spacing="1">ETHIOPIAN LABOUR PROCLAMATION 1156/2019</text>

      <g transform="translate(380, 4)">
        <rect width="124" height="26" rx="13" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="1" />
        <text x="14" y="17" fill="#C084FC" font-family="sans-serif" font-weight="700" font-size="11">✓ LEGALLY BINDING</text>
      </g>
    </g>

    <line x1="36" y1="88" x2="544" y2="88" stroke="#C084FC" stroke-opacity="0.15" stroke-width="1" />

    <!-- Key Clauses -->
    <g transform="translate(36, 112)">
      <text x="0" y="14" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="700">Contract Reference: #DS-ET-2026-0842</text>
      <text x="0" y="38" fill="#A78BFA" font-family="sans-serif" font-size="12">Parties: Verified Client &amp; Samuel T. (Fayda Verified #3104-8821)</text>

      <!-- Scope box -->
      <g transform="translate(0, 56)">
        <rect width="508" height="120" rx="14" fill="#000" fill-opacity="0.35" stroke="#C084FC" stroke-opacity="0.2" stroke-width="1" />
        <text x="16" y="24" fill="#FFF" font-family="sans-serif" font-weight="700" font-size="12">1. Scope &amp; Quality Warranty:</text>
        <text x="16" y="44" fill="#D8B4FE" font-family="sans-serif" font-size="11">Three-phase main electrical breaker panel renewal in Kezira District, Kebele 01.</text>
        <text x="16" y="68" fill="#FFF" font-family="sans-serif" font-weight="700" font-size="12">2. Escrow &amp; Disbursal Mechanism:</text>
        <text x="16" y="88" fill="#D8B4FE" font-family="sans-serif" font-size="11">Full compensation (ETB 4,500.00) locked in Chapa Escrow prior to commencement.</text>
        <text x="16" y="106" fill="#A78BFA" font-family="sans-serif" font-size="10.5">Funds released solely upon Client physical inspection and 4-digit PIN verification.</text>
      </g>
    </g>

    <!-- Signatures section -->
    <g transform="translate(36, 320)">
      <!-- Client Signature -->
      <g>
        <rect width="240" height="70" rx="12" fill="#140E26" stroke="#C084FC" stroke-opacity="0.3" stroke-width="1" />
        <text x="14" y="22" fill="#A78BFA" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">CLIENT DIGITAL SIGNATURE</text>
        <text x="14" y="46" fill="#38BDF8" font-family="monospace" font-size="14" font-weight="bold">✓ SIGNED [0x8f2a...c9]</text>
        <text x="14" y="60" fill="#64748B" font-family="sans-serif" font-size="9">Timestamp: Oct 16, 2026 · 14:22 EAT</text>
      </g>

      <!-- Worker Signature -->
      <g transform="translate(268, 0)">
        <rect width="240" height="70" rx="12" fill="#140E26" stroke="#C084FC" stroke-opacity="0.3" stroke-width="1" />
        <text x="14" y="22" fill="#A78BFA" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">WORKER FAYDA SIGNATURE</text>
        <text x="14" y="46" fill="#10B981" font-family="monospace" font-size="14" font-weight="bold">✓ FAYDA AUTH [Verified]</text>
        <text x="14" y="60" fill="#64748B" font-family="sans-serif" font-size="9">Samuel T. · Kezira Pro</text>
      </g>
    </g>
  </g>
</svg>
