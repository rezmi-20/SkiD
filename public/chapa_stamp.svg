<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Gradients for modern logo -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f62ac" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="lightBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    
    <!-- Stamp texture filter for realistic ink look -->
    <filter id="stamp-texture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <!-- Add a slight blur and merge to simulate ink bleeding -->
      <feGaussianBlur in="displaced" stdDeviation="0.4" result="blurred" />
      <feMerge>
        <feMergeNode in="blurred" />
        <feMergeNode in="SourceGraphic" opacity="0.3" />
      </feMerge>
    </filter>

    <!-- Paths for circular text -->
    <!-- Top text path: Clockwise arc from left to right -->
    <path id="topTextPath" d="M 58,200 A 142,142 0 0,1 342,200" fill="none" />
    <!-- Bottom text path: Counter-clockwise arc from left to right (to keep text upright) -->
    <!-- Radius is set to 158 so that the inward-hanging text aligns visually with the outward-hanging top text -->
    <path id="bottomTextPath" d="M 42,200 A 158,158 0 0,0 358,200" fill="none" />
  </defs>

  <!-- Group with stamp filter applied -->
  <g filter="url(#stamp-texture)">
    <!-- Outer concentric circles -->
    <circle cx="200" cy="200" r="185" stroke="#0f62ac" stroke-width="3" fill="none" />
    <circle cx="200" cy="200" r="176" stroke="#0f62ac" stroke-width="1.5" fill="none" />
    
    <!-- Inner border separating text and center logo -->
    <circle cx="200" cy="200" r="120" stroke="#0f62ac" stroke-width="3" fill="none" />

    <!-- Separator Dots (Left and Right) -->
    <circle cx="48" cy="200" r="6" fill="#0f62ac" />
    <circle cx="352" cy="200" r="6" fill="#0f62ac" />

    <!-- Top Text: Amharic (ቻፓ ፋይናንሻል ቴክኖሎጂስ አክሲዮን ማኅበር) -->
    <text font-family="'Inter', 'Noto Sans Ethiopic', 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#0f62ac" letter-spacing="1.5">
      <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">
        ቻፓ ፋይናንሻል ቴክኖሎጂስ አክሲዮን ማኅበር
      </textPath>
    </text>

    <!-- Bottom Text: English (Chapa Financial Technologies SC) -->
    <text font-family="'Inter', 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#0f62ac" letter-spacing="1.5">
      <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">
        Chapa Financial Technologies SC
      </textPath>
    </text>

    <!-- Center Section -->
    <!-- Modern Beautiful Logo -->
    <g transform="translate(115, 115)">
      <!-- Left loop (representing security and continuity) -->
      <path d="M 60,85 C 30,85 10,65 10,45 C 10,25 30,5 60,5 C 90,5 110,35 125,55 C 135,68 145,85 160,85 C 175,85 180,70 170,55" 
            fill="none" stroke="url(#blueGrad)" stroke-width="14" stroke-linecap="round" />
      
      <!-- Right loop (representing transactions and forward growth) -->
      <path d="M 110,5 C 130,5 150,25 150,45 C 150,65 130,85 110,85 C 80,85 60,55 45,35 C 35,22 25,5 10,5 C -5,5 -10,20 0,35" 
            fill="none" stroke="url(#lightBlueGrad)" stroke-width="14" stroke-linecap="round" />

      <!-- Nodes representing secure connection endpoints -->
      <circle cx="10" cy="45" r="5" fill="#ffffff" />
      <circle cx="150" cy="45" r="5" fill="#ffffff" />
    </g>

    <!-- Phone Number -->
    <text x="200" y="278" font-family="'Inter', 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#0f62ac" text-anchor="middle" letter-spacing="1">
      0960724272
    </text>
  </g>
</svg>
