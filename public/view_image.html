<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #111; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { display: flex; gap: 40px; align-items: center; }
        .logo-box { border: 2px solid #333; background: black; padding: 20px; width: 400px; height: 400px; box-sizing: border-box; }
        svg { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <h1>DireSkill Monogram SVG Verification</h1>
    <div class="container">
        <div class="logo-box">
            <svg viewBox="0 0 400 400">
              <!-- Grid lines for alignment verification -->
              <line x1="200" y1="0" x2="200" y2="400" stroke="#333" stroke-width="1" />
              <line x1="0" y1="200" x2="400" y2="200" stroke="#333" stroke-width="1" />
              
              <!-- Monogram D -->
              <path d="M 155,215 L 155,125 L 195,125 A 45,45 0 0,1 195,215 Z" 
                    fill="none" stroke="white" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" />
              
              <!-- Monogram S -->
              <path d="M 130,245 L 190,245 C 220,245 230,225 225,205 C 215,185 170,185 155,170 C 155,150 170,140 195,140 L 260,140" 
                    fill="none" stroke="white" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" />
            </svg>
        </div>
    </div>
</body>
</html>
