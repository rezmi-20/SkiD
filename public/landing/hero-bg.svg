<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none" width="100%" height="100%">
  <defs>
    <!-- Radial Ambient Lighting -->
    <radialGradient id="heroEmeraldGlow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#090b0e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="heroCyanGlow" cx="20%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.09" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#090b0e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="heroCenterSpot" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#090b0e" stop-opacity="0" />
    </radialGradient>

    <!-- Technical Blueprint Engineering Grid -->
    <pattern id="blueprintGridMajor" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.04" />
      <path d="M 60 0 L 60 120 M 0 60 L 120 60" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.02" stroke-dasharray="3 3" />
      <circle cx="120" cy="120" r="2" fill="#4ade80" fill-opacity="0.25" />
      <circle cx="60" cy="60" r="1" fill="#ffffff" fill-opacity="0.1" />
    </pattern>

    <!-- Diagonal Engineering Hatch -->
    <pattern id="diagonalHatchPattern" width="24" height="24" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.02" />
    </pattern>

    <!-- Linear Gradient for Electrical Traces -->
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Solid Obsidian Canvas Backdrop -->
  <rect width="100%" height="100%" fill="#090b0e" />

  <!-- Luminous Ambient Light Fields -->
  <rect width="100%" height="100%" fill="url(#heroEmeraldGlow)" />
  <rect width="100%" height="100%" fill="url(#heroCyanGlow)" />
  <rect width="100%" height="100%" fill="url(#heroCenterSpot)" />

  <!-- Technical Blueprint Grid Layer -->
  <rect width="100%" height="100%" fill="url(#blueprintGridMajor)" />

  <!-- ── PROJECT SPECIFIC TRADE GRAPHICS: DIRE DAWA LABOR & ENGINEERING ── -->

  <!-- Top Telemetry & Coordinates Annotation -->
  <g opacity="0.4" transform="translate(60, 50)">
    <text x="0" y="0" fill="#4ade80" font-family="monospace" font-size="11" letter-spacing="3" font-weight="bold">DIRE DAWA URBAN LABOR CORRIDOR // 9.5931° N, 41.8661° E</text>
    <text x="0" y="18" fill="#71717a" font-family="monospace" font-size="9" letter-spacing="2">FAYDA NID REPOSITORY · CHAPA SETTLEMENT · TAMPER-EVIDENT CONTRACT ENGINE</text>
  </g>

  <!-- Precision Engineering Compass & Radar Arcs (Top Right) -->
  <g transform="translate(1250, 280)">
    <!-- Outer Blueprint Circles -->
    <circle cx="0" cy="0" r="520" stroke="#ffffff" stroke-width="1" stroke-opacity="0.03" stroke-dasharray="12 8" />
    <circle cx="0" cy="0" r="420" stroke="#4ade80" stroke-width="1.2" stroke-opacity="0.06" />
    <circle cx="0" cy="0" r="320" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.04" stroke-dasharray="6 6" />
    <circle cx="0" cy="0" r="220" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.03" />
    <circle cx="0" cy="0" r="120" stroke="#4ade80" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="2 4" />
    <circle cx="0" cy="0" r="6" fill="#4ade80" fill-opacity="0.3" />

    <!-- Crosshair Calibration Axis -->
    <line x1="-540" y1="0" x2="540" y2="0" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04" stroke-dasharray="8 4" />
    <line x1="0" y1="-540" x2="0" y2="540" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04" stroke-dasharray="8 4" />

    <!-- Degree Notches (45°, 135°, 225°, 315°) -->
    <line x1="-220" y1="-220" x2="-240" y2="-240" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.1" />
    <line x1="220" y1="-220" x2="240" y2="-240" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.1" />
    <line x1="220" y1="220" x2="240" y2="240" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.1" />
    <line x1="-220" y1="220" x2="-240" y2="240" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.1" />
  </g>

  <!-- Electrical Trade Schematic & Circuit Traces (Upper Center to Right) -->
  <g opacity="0.08" transform="translate(850, 100)">
    <!-- Circuit Board Bus Lines -->
    <path d="M 0 50 L 150 50 L 220 120 L 400 120 L 460 60 L 600 60" fill="none" stroke="#4ade80" stroke-width="1.5" />
    <path d="M 50 150 L 180 150 L 260 230 L 480 230" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 4" />
    <path d="M 120 280 L 300 280 L 360 340 L 550 340" fill="none" stroke="#ffffff" stroke-width="1.2" />

    <!-- Circuit Connection Nodes & Terminals -->
    <circle cx="150" cy="50" r="4" fill="#4ade80" />
    <circle cx="220" cy="120" r="4" fill="#38bdf8" />
    <circle cx="400" cy="120" r="4" fill="#4ade80" />
    <circle cx="460" cy="60" r="4" fill="#ffffff" />
    <circle cx="260" cy="230" r="4" fill="#38bdf8" />
    <circle cx="360" cy="340" r="4" fill="#4ade80" />

    <!-- Ground / Electrical Resistor Vector Symbol -->
    <g transform="translate(480, 218)">
      <path d="M 0 12 L 10 0 L 20 24 L 30 0 L 40 24 L 50 12" fill="none" stroke="#4ade80" stroke-width="2" />
    </g>
  </g>

  <!-- Plumbing & Piping Isometric Schematic (Bottom Right) -->
  <g opacity="0.07" transform="translate(1080, 560)">
    <!-- Isometric Pipe Network -->
    <path d="M 0 100 L 120 30 L 260 110 L 260 250 L 380 180 L 500 250" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M 120 30 L 120 180 L 260 250" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" />
    <!-- Pressure Valve Rings -->
    <circle cx="120" cy="30" r="8" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="260" cy="110" r="8" fill="none" stroke="#4ade80" stroke-width="2" />
    <circle cx="260" cy="250" r="8" fill="none" stroke="#ffffff" stroke-width="2" />
    <circle cx="380" cy="180" r="8" fill="none" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Carpentry & Finishing Ruler / Dimension Markings (Left Margin) -->
  <g opacity="0.06" transform="translate(30, 240)">
    <line x1="0" y1="0" x2="0" y2="400" stroke="#ffffff" stroke-width="1.5" />
    <!-- Ticks every 20px -->
    <line x1="0" y1="0" x2="16" y2="0" stroke="#ffffff" stroke-width="1" />
    <line x1="0" y1="20" x2="8" y2="20" stroke="#ffffff" stroke-width="0.75" />
    <line x1="0" y1="40" x2="12" y2="40" stroke="#ffffff" stroke-width="0.75" />
    <line x1="0" y1="60" x2="8" y2="60" stroke="#ffffff" stroke-width="0.75" />
    <line x1="0" y1="80" x2="16" y2="80" stroke="#ffffff" stroke-width="1" />
    <line x1="0" y1="100" x2="8" y2="100" stroke="#ffffff" stroke-width="0.75" />
    <line x1="0" y1="120" x2="12" y2="120" stroke="#ffffff" stroke-width="0.75" />
    <line x1="0" y1="140" x2="8" y2="140" stroke="#ffffff" stroke-width="0.75" />
    <line x1="0" y1="160" x2="16" y2="160" stroke="#4ade80" stroke-width="1.5" />
    <line x1="0" y1="180" x2="8" y2="180" stroke="#ffffff" stroke-width="0.75" />
    <line x1="0" y1="200" x2="12" y2="200" stroke="#ffffff" stroke-width="0.75" />
    <line x1="0" y1="220" x2="8" y2="220" stroke="#ffffff" stroke-width="0.75" />
    <line x1="0" y1="240" x2="16" y2="240" stroke="#4ade80" stroke-width="1.5" />
    <line x1="0" y1="260" x2="8" y2="260" stroke="#ffffff" stroke-width="0.75" />
    <line x1="0" y1="280" x2="12" y2="280" stroke="#ffffff" stroke-width="0.75" />
    <line x1="0" y1="300" x2="8" y2="300" stroke="#ffffff" stroke-width="0.75" />
    <line x1="0" y1="320" x2="16" y2="320" stroke="#4ade80" stroke-width="1.5" />
    <line x1="0" y1="340" x2="8" y2="340" stroke="#ffffff" stroke-width="0.75" />
    <line x1="0" y1="360" x2="12" y2="360" stroke="#ffffff" stroke-width="0.75" />
    <line x1="0" y1="380" x2="8" y2="380" stroke="#ffffff" stroke-width="0.75" />
    <line x1="0" y1="400" x2="16" y2="400" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Digital Trust Cryptographic Nodes & Fayda Verification Lattice (Bottom Left) -->
  <g opacity="0.08" transform="translate(140, 720)">
    <!-- Hexagonal Verification Lattice -->
    <polygon points="60,0 120,35 120,105 60,140 0,105 0,35" fill="none" stroke="#4ade80" stroke-width="1.5" />
    <polygon points="180,0 240,35 240,105 180,140 120,105 120,35" fill="none" stroke="#38bdf8" stroke-width="1" />
    <polygon points="120,105 180,140 180,210 120,245 60,210 60,140" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 4" />
    <!-- Node Connectors -->
    <circle cx="60" cy="0" r="3" fill="#4ade80" />
    <circle cx="120" cy="35" r="3.5" fill="#4ade80" />
    <circle cx="120" cy="105" r="4" fill="#38bdf8" />
    <circle cx="60" cy="140" r="3" fill="#ffffff" />
    <circle cx="180" cy="140" r="3.5" fill="#4ade80" />
  </g>

  <!-- Diagonal Construction Perspective Rays -->
  <line x1="0" y1="950" x2="1600" y2="650" stroke="#4ade80" stroke-width="0.75" stroke-opacity="0.03" />
  <line x1="0" y1="850" x2="1600" y2="450" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.02" stroke-dasharray="16 8" />

  <!-- Bottom Dark Fade Grounding -->
  <rect x="0" y="750" width="100%" height="250" fill="url(#diagonalHatchPattern)" opacity="0.3" />
</svg>
