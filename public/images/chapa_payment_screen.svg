<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="100%" height="100%">
  <defs>
    <linearGradient id="chapaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021C14" />
      <stop offset="40%" stop-color="#072C20" />
      <stop offset="100%" stop-color="#02150E" />
    </linearGradient>
    <linearGradient id="chapaGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00A859" />
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A3A2A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#041E15" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00E676" stop-opacity="0" />
    </linearGradient>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Deep Emerald Background -->
  <rect width="700" height="520" fill="url(#chapaBg)" />

  <!-- Ambient Glow -->
  <circle cx="580" cy="90" r="260" fill="url(#pulseGlow)" />
  <circle cx="80" cy="460" r="200" fill="url(#pulseGlow)" />

  <!-- Diagonal Tech Grid Pattern -->
  <g stroke="#00E676" stroke-opacity="0.07" stroke-width="1.2">
    <line x1="0" y1="80" x2="700" y2="80" />
    <line x1="0" y1="160" x2="700" y2="160" />
    <line x1="0" y1="240" x2="700" y2="240" />
    <line x1="0" y1="320" x2="700" y2="320" />
    <line x1="0" y1="400" x2="700" y2="400" />
    <line x1="140" y1="0" x2="140" y2="520" />
    <line x1="280" y1="0" x2="280" y2="520" />
    <line x1="420" y1="0" x2="420" y2="520" />
    <line x1="560" y1="0" x2="560" y2="520" />
  </g>

  <!-- Central Mobile Checkout Mockup Interface -->
  <g filter="url(#cardShadow)" transform="translate(60, 40)">
    <!-- Main Modal Frame -->
    <rect width="580" height="440" rx="26" fill="url(#glassCard)" stroke="#00E676" stroke-opacity="0.4" stroke-width="1.8" />

    <!-- Top Chapa Branding Header -->
    <g transform="translate(36, 28)">
      <!-- Official Chapa Logo Symbol -->
      <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#chapaGreenGrad)" />
      <!-- Logo checkmark/knot -->
      <path d="M12 21 L18 27 L28 14" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

      <!-- Chapa Wordmark -->
      <text x="52" y="27" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" letter-spacing="-0.5">chapa</text>
      <text x="122" y="27" fill="#00E676" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" letter-spacing="1.5">PAYMENT GATEWAY</text>

      <!-- Verified Escrow Status Pill -->
      <g transform="translate(350, 4)">
        <rect width="150" height="28" rx="14" fill="#00E676" fill-opacity="0.18" stroke="#00E676" stroke-opacity="0.5" stroke-width="1" />
        <circle cx="16" cy="14" r="4.5" fill="#00E676" />
        <text x="28" y="18" fill="#00E676" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" letter-spacing="0.5">ESCROW ACTIVE</text>
      </g>
    </g>

    <!-- Divider -->
    <line x1="36" y1="84" x2="544" y2="84" stroke="#00E676" stroke-opacity="0.18" stroke-width="1" />

    <!-- Transaction Amount & Details -->
    <g transform="translate(36, 105)">
      <text x="0" y="16" fill="#88D4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Service Escrow Hold · Kezira District</text>

      <!-- Huge Price Amount -->
      <text x="0" y="60" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-1">ETB 4,500.00</text>

      <text x="310" y="60" fill="#00E676" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">✓ Funds Held in Escrow</text>

      <text x="0" y="86" fill="#71A892" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Release Code: Client 4-Digit PIN upon job inspection</text>
    </g>

    <!-- Supported Ethiopian Payment Rails Badges -->
    <g transform="translate(36, 215)">
      <text x="0" y="14" fill="#A3D9C0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">INSTANT DEPOSIT CHANNELS</text>

      <!-- Channel Pills -->
      <!-- Telebirr -->
      <g transform="translate(0, 26)">
        <rect width="115" height="38" rx="10" fill="#0072CE" fill-opacity="0.3" stroke="#0072CE" stroke-opacity="0.8" stroke-width="1.2" />
        <circle cx="20" cy="19" r="8" fill="#0072CE" />
        <text x="16" y="23" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="11">t</text>
        <text x="34" y="23" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="12">telebirr</text>
      </g>

      <!-- CBE Birr -->
      <g transform="translate(125, 26)">
        <rect width="120" height="38" rx="10" fill="#7A1C74" fill-opacity="0.3" stroke="#A82B9E" stroke-opacity="0.8" stroke-width="1.2" />
        <text x="16" y="24" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="12">CBE Birr</text>
      </g>

      <!-- Awash Bank -->
      <g transform="translate(255, 26)">
        <rect width="115" height="38" rx="10" fill="#E86C00" fill-opacity="0.25" stroke="#E86C00" stroke-opacity="0.8" stroke-width="1.2" />
        <text x="16" y="24" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="12">Awash Bank</text>
      </g>

      <!-- Debit / Credit Cards -->
      <g transform="translate(380, 26)">
        <rect width="128" height="38" rx="10" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.2" />
        <text x="16" y="24" fill="#E2E8F0" font-family="sans-serif" font-weight="bold" font-size="12">Visa / Master</text>
      </g>
    </g>

    <!-- Bottom Security Footprint -->
    <g transform="translate(36, 305)">
      <rect width="508" height="90" rx="16" fill="#00E676" fill-opacity="0.09" stroke="#00E676" stroke-opacity="0.25" stroke-width="1" />

      <!-- Lock Icon -->
      <g transform="translate(20, 28)">
        <circle cx="16" cy="16" r="16" fill="#00E676" fill-opacity="0.2" />
        <path d="M12 15 V11 A4 4 0 0 1 20 11 V15 M9 15 H23 V24 H9 Z" fill="none" stroke="#00E676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <text x="64" y="38" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14">256-Bit Bank-Grade Encrypted Protection</text>
      <text x="64" y="58" fill="#88D4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Workers never start unpaid. Homeowners never lose money on poor craftsmanship.</text>
    </g>
  </g>
</svg>
